name: Build and Release PowerVR BXM-8-256 Vulkan Driver

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Driver (AArch64 Android)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Host Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson \
            ninja-build \
            bison \
            flex \
            glslang-tools \
            pkg-config \
            libdrm-dev \
            gcc-aarch64-linux-gnu \
            binutils-aarch64-linux-gnu

      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Run Host Mock Regression Suite
        run: |
          echo "=== Running Host Mock Regression & ABI Tests ==="
          gcc -Wall -Wextra -Werror -O2 tests/test_bridge_v25_mock.c -o tests/test_bridge_v25_mock
          ./tests/test_bridge_v25_mock

      - name: Ensure Mesa Source Tree
        run: |
          echo "=== Setting up Mesa Source Tree ==="
          if [ ! -d "research/mesa-src/src" ]; then
            git submodule update --init --recursive || ./tools/setup_mesa.sh
          fi

      - name: Build Native Host Helpers
        run: |
          echo "=== Building Native Host Helpers (mesa_clc, etc.) ==="
          mkdir -p tools/native-bin
          meson setup research/mesa-src/build-native research/mesa-src \
            -Dbuildtype=release \
            -Dgallium-drivers= \
            -Dvulkan-drivers=imagination \
            -Dplatforms= \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dtools=imagination \
            -Dmesa-clc=enabled \
            -Dprecomp-compiler=enabled
          ninja -C research/mesa-src/build-native \
            src/compiler/clc/mesa_clc \
            src/compiler/spirv/vtn_bindgen2 \
            src/imagination/pco/uscgen/pco_clc \
            src/imagination/pdsc/pdsc_precomp
          cp research/mesa-src/build-native/src/compiler/clc/mesa_clc tools/native-bin/
          cp research/mesa-src/build-native/src/compiler/spirv/vtn_bindgen2 tools/native-bin/
          cp research/mesa-src/build-native/src/imagination/pco/uscgen/pco_clc tools/native-bin/
          cp research/mesa-src/build-native/src/imagination/pdsc/pdsc_precomp tools/native-bin/
          chmod +x tools/native-bin/*

      - name: Compile Android AArch64 Driver & Package Zips
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          echo "=== Cross-Compiling Vulkan Driver for Android AArch64 ==="
          ./tools/build_driver.sh

      - name: Upload CI Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bxm8256-vulkan-driver
          path: |
            dist/*.zip
            dist/standalone_icd/

      - name: Extract Release Notes from Changelog
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        id: release_notes
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG_NAME" ] || [ "$TAG_NAME" = "refs/heads/main" ]; then
            TAG_NAME="v0.1.0-alpha"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          
          python3 -c '
          import os, re
          tag = "'"$TAG_NAME"'".lstrip("v")
          notes = []
          found = False
          if os.path.isfile("CHANGELOG.md"):
              with open("CHANGELOG.md") as f:
                  for line in f:
                      if re.match(rf"^##\s+\[?v?{re.escape(tag)}", line):
                          found = True
                          continue
                      elif found and line.startswith("## "):
                          break
                      elif found:
                          notes.append(line)
          if not notes:
              notes = ["### PowerVR BXM-8-256 Turnip-like Mesa Vulkan Driver\n\nRelease built automatically from tag " + "'"$TAG_NAME"'"]
          with open("RELEASE_NOTES.md", "w") as out:
              out.writelines(notes)
          '
          echo "notes_file=RELEASE_NOTES.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: "PowerVR BXM-8-256 Vulkan Driver ${{ steps.release_notes.outputs.tag_name }}"
          body_path: RELEASE_NOTES.md
          files: |
            dist/vulkan_pvr_bxm8256_adrenotools.zip
            dist/vulkan_pvr_bxm8256_icd.zip
            dist/standalone_icd/powervr_icd.aarch64.json
          draft: false
          prerelease: true


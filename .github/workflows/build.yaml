name: Mesa BXM-8-256 checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  host-checks:
    name: host checks
    runs-on: ubuntu-latest
    steps:
      # The host gates inspect the Mesa impression of the driver, which lives in
      # the research/mesa-src submodule, so it has to be present.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Python3
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # The gates inspect generated packet headers (bit positions, enum values),
      # which a fresh checkout does not have. Generate them the same way meson
      # does instead of requiring a full driver build.
      - name: Generate CSB packet headers
        run: python3 tools/gen_csb_headers.py
      - name: Run host Python checks
        run: |
          set -e
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet pyyaml
          python3 test_multiviewport_wiring.py
          python3 test_int64_lowering.py
          python3 test_bc_image_path.py
          python3 test_astc_format_coverage.py
          python3 test_depth_clamp_wiring.py
          python3 test_volcanic_mock.py
          python3 test_volcanic_header_validation.py
      - name: Build and run BC decode test
        run: |
          set -e
          sh tests/build_test_bc_decode.sh
          ./tests/test_bc_decode
      - name: Compile and run C mock tests
        run: |
          set -e
          gcc -I. -o tests/test_bridge_v25_mock tests/test_bridge_v25_mock.c
          gcc -I. -o tests/test_drm_shim_mock tests/test_drm_shim_mock.c
          ./tests/test_bridge_v25_mock
          ./tests/test_drm_shim_mock
